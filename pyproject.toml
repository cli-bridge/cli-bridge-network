[project]
name = "cli-bridge-network"
version = "0.1.0"
description = "Local-first capability network for CLI tools, parsers, MCP servers, and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
cbn = "cbn.cli:main"

[project.optional-dependencies]
pty = [
  "pywinpty>=2.0; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests-unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
