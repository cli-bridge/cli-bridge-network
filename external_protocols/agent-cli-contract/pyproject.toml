[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cli-contract"
version = "0.1.0"
description = "Standalone AgentCliCard and RunReceipt contract validator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-cli-contract = "agent_cli_contract.__main__:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
